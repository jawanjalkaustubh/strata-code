    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background-color: #0c0e14;
        color: #f1f5f9;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden;
        user-select: none;
      }
      .splash-container {
        height: 100vh;
        width: 100vw;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 38%, rgba(20, 184, 166, 0.16) 0%, rgba(12, 14, 20, 1) 70%);
      }
      .splash-logo-container {
        width: 96px;
        height: 96px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        animation: pulse-logo 2.4s ease-in-out infinite alternate;
      }
      .splash-logo-img {
        width: 88px;
        height: 88px;
        object-fit: contain;
        filter: drop-shadow(0 0 24px rgba(45, 212, 191, 0.45));
      }
      .splash-title-wrap {
        margin-top: 18px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .splash-title {
        font-size: 34px;
        font-weight: 800;
        letter-spacing: 4px;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        line-height: 1;
      }
      .splash-subtitle {
        margin-top: 5px;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 5px;
        color: #94a3b8;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      .splash-badge {
        margin-top: 14px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        color: #2dd4bf;
        background: rgba(20, 184, 166, 0.12);
        padding: 4px 14px;
        border-radius: 20px;
        border: 1px solid rgba(45, 212, 191, 0.3);
      }
      .splash-bar-container {
        margin-top: 26px;
        width: 300px;
        height: 6px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 6px;
        overflow: hidden;
        position: relative;
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      /* Indeterminate: the real progress is the React boot gates (App.tsx),
         not a timer with invented stage text. */
      .splash-bar-fill {
        height: 100%;
        width: 40%;
        background: linear-gradient(90deg, #14b8a6 0%, #06b6d4 50%, #3b82f6 100%);
